# Render Blueprint — first production deployment target for Quest Board.
# Nothing in Gates 0-7 built any deployment infrastructure; this is new,
# written to get a real public URL up. It has never been applied (that
# requires a Render account, which only you can create) — treat this as a
# strong starting point to import via Render's "New > Blueprint", not a
# guaranteed one-click deploy. See README.md's Deployment section for the
# steps and what to verify along the way, especially whether Render's
# managed Postgres allows `CREATE EXTENSION postgis` on your plan — that's
# the one real unknown this blueprint can't resolve in advance.

databases:
  - name: quest-board-postgres
    databaseName: questboard
    user: questboard
    plan: free
    postgresMajorVersion: '16'

services:
  - type: redis
    name: quest-board-redis
    plan: free
    ipAllowList: []

  - type: web
    name: quest-board-api
    runtime: node
    plan: free
    region: oregon
    # NODE_ENV=production below makes npm's default `omit=dev` config kick
    # in, which would silently skip devDependencies (typescript, @types/*)
    # that the build needs — --include=dev overrides that for this step only.
    buildCommand: npm ci --include=dev && npm run build --workspace=apps/api
    # preDeployCommand isn't available on free-tier services, so
    # `db:migrate`/`db:seed` run ahead of the server start instead — safe to
    # repeat on every deploy (migrations are tracked, seeds are ON CONFLICT
    # DO NOTHING).
    startCommand: npm run db:migrate && npm run db:seed && npm run start --workspace=apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: quest-board-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: quest-board-redis
          type: redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_NAME
        value: qb_session
      # fromService's `host` property resolves to the bare internal
      # service name (e.g. "quest-board-web"), not the public hostname —
      # useless for CORS checks against real browser Origin headers, which
      # always carry the full https://*.onrender.com URL. Hardcoded here
      # since Render's public hostname is deterministic; update if either
      # service is ever renamed or given a custom domain.
      - key: WEB_ORIGIN
        value: https://quest-board-web.onrender.com
      # Both blank: the Places/AI providers run in stub/degraded mode
      # until the Gate 0 licensing questions are answered and real keys
      # exist (docs/gate-0/04-provider-licensing-questions.md). Set these
      # in the Render dashboard, not here, once that review is done.
      - key: GOOGLE_PLACES_SERVER_API_KEY
        sync: false
      - key: AI_PROVIDER_API_KEY
        sync: false

  - type: web
    name: quest-board-web
    runtime: node
    plan: free
    region: oregon
    # Same devDependencies-under-NODE_ENV=production issue as the API
    # service above — tailwindcss, typescript, eslint, etc. all live there.
    buildCommand: npm ci --include=dev && npm run build --workspace=apps/web
    startCommand: npm run start --workspace=apps/web
    envVars:
      - key: NODE_ENV
        value: production
      # Same fromService/host caveat as WEB_ORIGIN above — the browser
      # (which NEXT_PUBLIC_API_BASE_URL is for) can't reach Render's
      # internal network at all, so both must be the public hostname.
      - key: API_BASE_URL
        value: https://quest-board-api.onrender.com
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://quest-board-api.onrender.com
      # Blank until you get your own Google Maps JavaScript API key
      # (separate from GOOGLE_PLACES_SERVER_API_KEY above — that one's
      # server-side only). Without it, /discover falls back to the
      # accessible list only, per Section 8's list-parity requirement.
      # NEXT_PUBLIC_ vars are baked into the client bundle at *build* time,
      # not read at runtime — after setting this in Render's dashboard you
      # need "Manual Deploy" (a real rebuild), not just a restart.
      - key: NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_API_KEY
        sync: false
